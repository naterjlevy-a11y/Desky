<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Desky</title>
<meta name="description" content="Say it once and it gets handled.">
<meta name="theme-color" content="#0E0D0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Desky">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<!-- ── sign in ─────────────────────────────────────────────── -->
<div id="gate" class="gate">
  <div class="gate-inner">
    <div class="mark" aria-hidden="true"></div>
    <h1>Desky</h1>
    <p class="gate-sub">Say it once and it gets handled.</p>
    <form id="signin-form" class="gate-form">
      <label class="field">
        <span>Email</span>
        <input id="email" type="email" inputmode="email" autocomplete="username"
               placeholder="you@example.com" required>
      </label>
      <label class="field" id="pw-field">
        <span>Password</span>
        <input id="password" type="password" autocomplete="current-password"
               placeholder="Your password">
      </label>
      <button id="signin" class="btn-primary" type="submit">Sign in</button>
      <div class="gate-alts">
        <button id="resetpw" class="linkish" type="button">Forgot password</button>
        <button id="uselink" class="linkish" type="button">Email me a link</button>
      </div>
    </form>
    <p id="gate-msg" class="gate-msg" role="status" aria-live="polite"></p>
  </div>
</div>

<!-- ── app ─────────────────────────────────────────────────── -->
<div id="app" class="app" hidden>

  <!-- 1 · DESK -->
  <section id="p-desk" class="panel">
    <div class="hero">
      <div class="hero-top">
        <span class="clock" id="clock"></span>
        <button id="signout" class="linkish">Sign out</button>
      </div>
      <div class="next-wrap" id="next">
        <span class="next-lbl" id="next-lbl">Next</span>
        <span class="next-room" id="next-room">&mdash;</span>
        <span class="next-val" id="next-val"></span>
        <span class="next-det" id="next-det"></span>
      </div>

      <div class="say-wrap">
        <textarea id="say" rows="1" placeholder="Say anything…"
                  autocomplete="off" autocapitalize="sentences"
                  aria-label="Say anything"></textarea>
        <button id="send" class="say-go" aria-label="Save">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path d="M4 12h13M12 5l7 7-7 7" fill="none" stroke="currentColor"
                  stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <p class="say-hint" id="say-hint">Hit the mic on your keyboard and talk.</p>
      <p class="inflight" id="inflight" hidden></p>
    </div>

    <div class="actions">
      <button class="act" data-cmd="granola">
        <span class="act-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M9 10h6M9 14h4"/></svg>
        </span>
        <span class="act-body">
          <span class="act-t">Check Granola</span>
          <span class="act-s">Pull anything new out of my recorded lectures</span>
        </span>
        <span class="act-go" aria-hidden="true">›</span>
      </button>

      <button class="act" data-cmd="goodnotes">
        <span class="act-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 19.5V6a2 2 0 012-2h13v16H6a2 2 0 01-2-2z"/><path d="M15 8.5l-5 5"/></svg>
        </span>
        <span class="act-body">
          <span class="act-t">Check GoodNotes</span>
          <span class="act-s">Read my new lecture notes and file them</span>
        </span>
        <span class="act-go" aria-hidden="true">›</span>
      </button>
    </div>

    <p class="sync" id="sync"></p>
    <div class="deskfoot" id="deskfoot" hidden>
      <button id="selftest" class="linkish">Test connection</button>
      <button id="setpw" class="linkish">Set a password</button>
      <span class="linkish" id="ver"></span>
    </div>
    <p class="sync" id="testout"></p>
  </section>

  <!-- 2 · TASKS -->
  <section id="p-tasks" class="panel" hidden>
    <h2 class="ph">Tasks</h2>
    <p class="psub">Things that still need you. Anything I already handled lives in the Inbox.</p>
    <div id="tasks" class="stack"></div>
  </section>

  <!-- 3 · INBOX -->
  <section id="p-inbox" class="panel" hidden>
    <div class="head-flex">
      <h2 class="ph">Inbox</h2>
      <button id="filter" class="chip" aria-pressed="false">Showing: all</button>
    </div>
    <p class="psub" id="inbox-sub"></p>
    <div id="inbox" class="stack"></div>
  </section>

  <!-- 4 · SCHOOL -->
  <section id="p-school" class="panel" hidden>
    <div id="school-list">
      <div id="school-next" class="snaps"></div>

      <h3 class="eyebrow">Today</h3>
      <div id="today" class="stack"></div>

      <h3 class="eyebrow">Due soon</h3>
      <div id="school-cards" class="stack"></div>

      <h3 class="eyebrow">This week</h3>
      <div id="week" class="stack"></div>

      <h3 class="eyebrow">All courses</h3>
      <div id="courses" class="stack"></div>
    </div>
    <div id="course-detail" hidden></div>
  </section>

  <!-- 5 · WORK -->
  <section id="p-work" class="panel" hidden>
    <h2 class="ph">Work</h2>
    <p class="psub">Internships, applications, anything career.</p>
    <div id="work-cards" class="stack"></div>
  </section>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" data-panel="desk" aria-selected="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h18M5 9V6h14v3M4 9v9h16V9M9 18v2M15 18v2"/></svg>
      <span>Desk</span>
    </button>
    <button role="tab" data-panel="tasks" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7l2 2 4-4M4 15l2 2 4-4M13 7h7M13 17h7"/></svg>
      <span>Tasks</span><i class="dot" id="dot-tasks" hidden></i>
    </button>
    <button role="tab" data-panel="school" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4L2 9l10 5 10-5-10-5zM6 12v5c0 1 3 2 6 2s6-1 6-2v-5"/></svg>
      <span>School</span>
    </button>
    <button role="tab" data-panel="work" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16v11H4zM9 8V6a2 2 0 012-2h2a2 2 0 012 2v2M4 13h16"/></svg>
      <span>Work</span>
    </button>
    <button role="tab" data-panel="inbox" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h4l2 3h4l2-3h4M4 13l2-7h12l2 7v5H4z"/></svg>
      <span>Log</span><i class="dot" id="dot-inbox" hidden></i>
    </button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
